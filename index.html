<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gelir Gider Takip</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Gelir & Gider Takip</h1>
        <p>Kişisel bütçenizi kolayca yönetin.</p>
      </header>

      <section class="summary" aria-label="Özet kartları">
        <article class="card">
          <h2>Toplam Gelir</h2>
          <p id="income">₺0,00</p>
        </article>
        <article class="card">
          <h2>Toplam Gider</h2>
          <p id="expense">₺0,00</p>
        </article>
        <article class="card balance">
          <h2>Bakiye</h2>
          <p id="balance">₺0,00</p>
        </article>
      </section>

      <section class="panel">
        <h2>Yeni Kayıt Ekle</h2>
        <form id="transaction-form">
          <label>
            Açıklama
            <input id="description" type="text" placeholder="Örn: Market alışverişi" required />
          </label>

          <label>
            Tutar (gelir için +, gider için -)
            <input id="amount" type="number" step="0.01" placeholder="Örn: -320" required />
          </label>

          <label>
            Tarih
            <input id="date" type="date" required />
          </label>

          <button type="submit">Kaydet</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>İşlem Geçmişi</h2>
          <button id="clear-all" class="danger" type="button">Tümünü Temizle</button>
        </div>
        <ul id="transaction-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="transaction-template">
      <li class="transaction-item">
        <div>
          <strong class="transaction-description"></strong>
          <small class="transaction-date"></small>
        </div>
        <div class="transaction-right">
          <span class="transaction-amount"></span>
          <button class="delete-btn" type="button" aria-label="Kaydı sil">Sil</button>
        </div>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
